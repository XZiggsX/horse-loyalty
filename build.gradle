plugins {
	// Minecraft 26.x is unobfuscated, so this is the non-remapping Loom plugin.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = 'horse-loyalty'
}

repositories {
	// Only needed when depending on other mods. Loom adds the repositories
	// for Minecraft and its libraries automatically.
}

loom {
	// Keeps client-only code (keybinds, input handling, rendering) in src/client
	// so it can never be loaded on a dedicated server by accident.
	splitEnvironmentSourceSets()

	runs {
		client {
			// Fixed dev username, so the offline player UUID stays the same between
			// launches. Otherwise horses you tamed last run belong to a "different" player.
			programArgs "--username", "XZiggsX"
		}
	}

	mods {
		"horseloyalty" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// Server game tests for the features and their switches, in src/gametest (its own test mod).
	// Run them with gradlew runGameTest.
	configureTests {
		createSourceSet = true
		modId = "horseloyalty-gametest"
		enableGameTests = true
		enableClientGameTests = false
	}
}

dependencies {
	// Versions live in gradle.properties
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API: data attachments, events, networking, keybinds.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Unit tests for the genetics core (src/test).
	testImplementation platform("org.junit:junit-bom:5.13.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	// The client source set too, for the screen layout tests (pure Java, no game needed).
	testImplementation sourceSets.client.output
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

test {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

jar {
	// Ships the license inside the jar, next to the mod's files.
	inputs.property "archivesName", project.base.archivesName
	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

java {
	// Also builds a -sources.jar with the code. Don't upload that one to Modrinth.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
