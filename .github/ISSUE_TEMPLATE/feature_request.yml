name: Idea or feedback
description: Suggest a feature, or tell us how riding and loyalty feel
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea or feedback
      description: What would you like to see, or what felt off (too fast, too slow, annoying)?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What would it add to your game?
